<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Orbital Insight | 3D FDO Dashboard</title>
    <script src="https://unpkg.com/deck.gl@8.9.0/dist.min.js" 
        integrity="sha384-xZMy+YOUR_GENERATED_HASH_GOES_HERE" 
        crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-primary: #0F172A; /* Rich dark blue [cite: 12] */
            --accent-emerald: #10B981; 
            --accent-ruby: #EF4444; 
            --glass: rgba(30, 41, 59, 0.7);
        }
        body { 
            margin: 0; background-color: var(--bg-primary); 
            color: #F8FAFC; font-family: 'Inter', sans-serif; overflow: hidden;
        }
        /* UI/UX: Glassmorphism Header  */
        header {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: var(--glass); backdrop-filter: blur(10px); 
            display: flex; align-items: center; padding: 0 20px; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #main-container { display: grid; grid-template-columns: 1fr 350px; height: 100vh; }
        
        #map-viewport { position: relative; width: 100%; height: 100%; }
        
        #sidebar { 
            background: rgba(15, 23, 42, 0.9); 
            border-left: 1px solid rgba(255,255,255,0.1); 
            padding: 80px 20px 20px; 
            z-index: 10;
        }
        .module-card { background: rgba(30, 41, 59, 0.5); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        
        /* UI/UX: Skeleton Screen styling [cite: 4] */
        .skeleton { background: #1E293B; animation: pulse 1.5s infinite; } 
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>
    <header>
        <h2 style="color: var(--accent-emerald); margin: 0; font-size: 1.2rem;">ORBITAL INSIGHT 3D</h2>
        <div style="margin-left: auto; color: #94A3B8; font-size: 0.8rem;">Press <kbd>Ctrl+K</kbd> to Search</div>
    </header>
    <div id="main-container">
        <div id="map-viewport"></div>
        <div id="sidebar">
            <div class="module-card">
                <h3>Fleet Health</h3>
                <div id="loader" class="skeleton" style="height: 100px; border-radius: 8px;"></div>
                <div id="stats" style="display: none;">
                    <p>Satellites: <span id="sat-count">0</span></p>
                    <p>Debris: <span id="deb-count">0</span></p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
